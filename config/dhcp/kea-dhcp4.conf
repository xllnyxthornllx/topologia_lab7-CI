// Kea DHCPv4 - Lab 07
// Ubuntu/Debian: apt install kea-dhcp4-server
// Archivo: /etc/kea/kea-dhcp4.conf  (haz backup antes)
// Interfaz real en VLAN 99. El relay (router) reenvia VLAN 30.
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": ["eth0"]
    },
    "lease-database": {
      "type": "memfile",
      "lfc-interval": 3600
    },
    "valid-lifetime": 691200,
    "renew-timer": 345600,
    "rebind-timer": 604800,
    "subnet4": [
      {
        "subnet": "172.18.99.0/24",
        "pools": [{ "pool": "172.18.99.100 - 172.18.99.180" }],
        "option-data": [
          { "name": "routers", "data": "172.18.99.1" },
          { "name": "domain-name-servers", "data": "8.8.8.8, 172.18.99.1" },
          { "name": "domain-name", "data": "lab07.local" }
        ]
      },
      {
        "subnet": "172.18.30.0/24",
        "pools": [{ "pool": "172.18.30.100 - 172.18.30.180" }],
        "option-data": [
          { "name": "routers", "data": "172.18.30.1" },
          { "name": "domain-name-servers", "data": "8.8.8.8, 172.18.30.1" }
        ],
        "reservations": [
          { "hw-address": "AA:BB:CC:DD:EE:01", "ip-address": "172.18.30.10", "hostname": "nvr-hikvision" },
          { "hw-address": "AA:BB:CC:DD:EE:02", "ip-address": "172.18.30.20", "hostname": "camara1" }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [{ "output": "/var/log/kea-dhcp4.log" }],
        "severity": "INFO"
      }
    ]
  }
}

// IP estatica del servidor (netplan ejemplo /etc/netplan/50-lab07.yaml):
// network:
//   version: 2
//   ethernets:
//     eth0:
//       addresses: [172.18.99.10/24]
//       routes: [{to: default, via: 172.18.99.1}]
//       nameservers: {addresses: [8.8.8.8, 172.18.99.1]}
//
// Comandos:
// sudo netplan apply
// sudo systemctl restart kea-dhcp4-server
// sudo systemctl status kea-dhcp4-server
// tail -f /var/log/kea-dhcp4.log
// kea-dhcp4 -t /etc/kea/kea-dhcp4.conf   # test sintaxis
